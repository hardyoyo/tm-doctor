[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tm-doctor"
version = "0.1.0"
description = "Diagnostic and recovery tools for macOS Time Machine"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "HJP" },
]
keywords = [
    "macos",
    "time-machine",
    "backup",
    "apfs",
]

dependencies = [
    "click>=8.1",
    "rich>=14.0",
]

[project.scripts]
tm-doctor = "tm_doctor.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[project.urls]
Repository = "https://github.com/hpottinger/tm-doctor"
Issues = "https://github.com/hpottinger/tm-doctor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
